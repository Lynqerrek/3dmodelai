<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Native 3D Modelling Studio</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js & OrbitControls Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FBX Exporter & JSZip CDN for Side-by-Side Model & Texture Packaging -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/FBXExporter.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* Custom scrollbar for dark UI */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        canvas {
            outline: none;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none bg-slate-950 font-sans text-slate-200">

    <!-- Top Header -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid font-bold fa-cube text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-slate-100 leading-tight">AI 3D Architect Engine</h1>
                <p class="text-xs text-slate-400">Ultra-Simple Commands &bull; Hyper-Realistic PBR Output</p>
            </div>
        </div>

        <!-- Quick Stats & Actions -->
        <div class="flex items-center space-x-4">
            <div class="text-xs text-slate-400 hidden sm:flex items-center space-x-3 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                <span>Objects: <strong id="objCount" class="text-indigo-400 font-mono">0</strong></span>
                <span class="text-slate-700">|</span>
                <span>Polys: <strong id="polyCount" class="text-indigo-400 font-mono">0</strong></span>
            </div>

            <!-- Export FBX + Textures Button -->
            <button onclick="exportFbxWithTextures()" class="px-3 py-1.5 text-xs bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg transition-colors flex items-center space-x-1.5">
                <i class="fa-solid fa-file-export"></i>
                <span>Export FBX + Textures (.zip)</span>
            </button>

            <button onclick="clearScene()" class="px-3 py-1.5 text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg transition-colors flex items-center space-x-1.5">
                <i class="fa-solid fa-trash-can"></i>
                <span>Clear Canvas</span>
            </button>
        </div>
    </header>

    <!-- Main App Workspace -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- Left Column: Command & Input Panel -->
        <aside class="w-full md:w-96 border-r border-slate-800 bg-slate-900 flex flex-col z-10 shrink-0">
            
            <!-- Step 1: User Request Input -->
            <div class="p-4 border-b border-slate-800 bg-slate-900/50">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>1. Describe What You Want</span>
                    <span class="text-[10px] text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">End of Prompt</span>
                </label>
                <textarea id="userRequestInput" rows="3" 
                    placeholder="e.g. Mechanical dragon with metallic scales, glowing blue plasma torus knot core, wings made of sleek prism panels..."
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition-all"></textarea>
            </div>

            <!-- Step 2: System Master Prompt Box -->
            <div class="flex-1 p-4 flex flex-col overflow-hidden bg-slate-900">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                        <span>2. Copy Prompt for AI</span>
                    </label>
                    <button onclick="copyMasterPrompt()" id="copyBtn" class="px-2.5 py-1 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium transition-all shadow-md shadow-indigo-600/20 flex items-center space-x-1">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copy Prompt</span>
                    </button>
                </div>
                
                <div class="flex-1 relative rounded-lg border border-slate-800 bg-slate-950 overflow-hidden">
                    <textarea id="generatedPromptText" readonly class="w-full h-full bg-transparent p-3 text-[11px] font-mono text-slate-400 leading-relaxed resize-none focus:outline-none select-all"></textarea>
                </div>
            </div>

            <!-- Step 3: Paste AI JSON Output -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/80">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>3. Paste AI Commands JSON</span>
                    <span class="text-[10px] text-slate-500">Auto-Parses</span>
                </label>
                <textarea id="aiJsonInput" rows="4" 
                    placeholder="Paste the JSON array response from your AI here... e.g. [{ &quot;type&quot;: &quot;torusKnot&quot;, &quot;p&quot;: [0,1,0], &quot;c&quot;: &quot;#00ffff&quot;, &quot;emiss&quot;: &quot;#00ffff&quot; }]"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 placeholder-slate-600 font-mono focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition-all"></textarea>

                <button onclick="parseAndExecute()" class="w-full mt-3 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-xs rounded-lg shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Execute Commands on Canvas</span>
                </button>
            </div>
        </aside>

        <!-- Right Column: 3D Viewport -->
        <section class="flex-1 relative bg-slate-950 flex flex-col">
            
            <!-- Canvas Container -->
            <div id="canvasContainer" class="w-full h-full relative cursor-grab active:cursor-grabbing"></div>

            <!-- Viewport Controls & Overlay Info -->
            <div class="absolute top-4 right-4 flex flex-col space-y-2 z-10">
                <button onclick="resetCamera()" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 hover:text-white backdrop-blur transition-all shadow-lg" title="Reset Camera">
                    <i class="fa-solid fa-arrows-to-eye"></i>
                </button>
                <button onclick="toggleGrid()" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 hover:text-white backdrop-blur transition-all shadow-lg" title="Toggle Grid Floor">
                    <i class="fa-solid fa-border-all"></i>
                </button>
                <button onclick="toggleWireframe()" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 hover:text-white backdrop-blur transition-all shadow-lg" title="Toggle Wireframe Mode">
                    <i class="fa-solid fa-vector-square"></i>
                </button>
            </div>

            <!-- Click Inspector Banner -->
            <div id="inspectorBanner" class="absolute bottom-4 left-4 right-4 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-lg p-3 text-xs text-slate-300 flex items-center justify-between shadow-xl hidden z-10">
                <div class="flex items-center space-x-3">
                    <span id="inspectColorBadge" class="w-4 h-4 rounded-full border border-white/20 inline-block"></span>
                    <div>
                        <span class="font-bold text-slate-100" id="inspectName">Object</span>
                        <span class="text-slate-400 text-[11px] ml-2 font-mono" id="inspectDetails">Pos: [0, 0, 0]</span>
                    </div>
                </div>
                <button onclick="hideInspector()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Status Notification Box -->
            <div id="toast" class="absolute top-4 left-4 bg-indigo-600/90 text-white text-xs px-3.5 py-2 rounded-lg backdrop-blur shadow-xl transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2 z-20 flex items-center space-x-2">
                <i class="fa-solid fa-circle-check" id="toastIcon"></i>
                <span id="toastMsg">Ready</span>
            </div>
        </section>
    </main>

    <!-- Application Engine Script -->
    <script>
        // Global Three.js Scene Variables
        let scene, camera, renderer, controls;
        let objectsMap = new Map();
        let gridHelper;
        let isWireframe = false;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // Maximized AI System Prompt Template - Empowering full AI creative freedom with realistic PBR properties
        const BASE_SYSTEM_PROMPT = `You are an elite 3D Master Architect and Senior Technical Artist. Output ONLY a raw JSON array of 3D primitive objects to build the user's request with hyper-realism, expressive volumetric geometry, rich structural depth, and flawless spatial composition.

### PRIMITIVES & GEOMETRY TYPES:
- "type": "box" | "sphere" | "cylinder" | "cone" | "torus" | "torusKnot" | "capsule" | "dodecahedron" | "icosahedron" | "octahedron" | "tetrahedron" | "ring" | "plane"

### EASY SHORTHAND & EXPRESSIVE PROPERTIES:
- "p" or "pos": [x, y, z] (Position coordinates, ensure model sits on or above ground Y >= 0)
- "r" or "rot": [rx, ry, rz] (Rotation angles in radians)
- "s" or "scale": [sx, sy, sz] (Scale multiplier)

### FLEXIBLE SIZING & MORPHING:
- "box": "size": [width, height, depth]
- "sphere" / "dodecahedron" / "icosahedron" / "octahedron" / "tetrahedron": "rad": radius
- "cylinder" / "cone": "radTop": topRadius, "radBot": bottomRadius, "h": height, "seg": radialSegments (3 = pyramid, 4 = prism/column, 6 = hexagonal column, 32 = smooth cylinder)
- "torus" / "torusKnot": "rad": radius, "tube": tubeRadius
- "capsule": "rad": radius, "h": height
- "ring" / "plane": "size": [width, height] or "radInner" / "radOuter"

### PHOTOREALISTIC PBR MATERIAL & LIGHTING ATTRIBUTES:
- "c" or "col": Color hex code (e.g., "#1e293b", "#3b82f6", "#f59e0b", "#e0e7ff", "#10b981")
- "rough": Roughness 0.0 to 1.0 (0.0 = ultra-reflective polished chrome/glass, 1.0 = matte leather/clay)
- "metal": Metalness 0.0 to 1.0 (0.0 = non-metallic organic/plastic, 1.0 = pure brushed metal/alloy)
- "trans": Transmission 0.0 to 1.0 (0.0 = solid, 1.0 = clear crystal glass/water)
- "opac": Opacity 0.0 to 1.0
- "emiss": Hex color for glowing neon/plasma/energy sources (e.g., "#00ffff", "#ff0055", "#eab308")
- "emissInt": Emissive light intensity (e.g., 1.5 to 5.0)
- "wire": true / false (wireframe toggle)

### MASTER 3D DESIGN RULES FOR HYPER-REALISM:
1. **Deconstruct with Precision**: Break the concept into primary skeleton structures, secondary supporting panels/frames, micro-details (joints, bolts, trim layers), and accent highlights.
2. **Material Contrast**: Blend high-metal structural elements with matte body parts and vibrant glowing core accents for maximum visual pop.
3. **Ground Alignment & Scale Balance**: Place base elements at Y = 0 or slightly above. Keep object proportions physically realistic and harmonious relative to neighboring primitives.
4. **Output Format**: Respond ONLY with a valid, clean JSON array enclosed in a markdown json block.

USER REQUEST:`;

        // Initialize Three.js Engine on Window Load
        window.addEventListener('load', () => {
            initEngine();
            setupEventListeners();
            updatePrompt();
            showToast("Engine initialized. Canvas ready!", "fa-circle-check");
        });

        // Setup 3D Scene, Lights, Camera & Renderer
        function initEngine() {
            const container = document.getElementById('canvasContainer');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            scene.fog = new THREE.FogExp2(0x090d16, 0.025);

            // Camera
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(8, 6, 10);

            // Renderer with PBR ACESFilmic Tone Mapping
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05; // Don't go far under floor ground

            // Studio Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.5);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            const rimLight = new THREE.PointLight(0xc084fc, 0.8, 20);
            rimLight.position.set(0, 5, -8);
            scene.add(rimLight);

            // Floor Grid Helper
            gridHelper = new THREE.GridHelper(30, 30, 0x475569, 0x1e293b);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Render Loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Resize Observer
            window.addEventListener('resize', onWindowResize);
        }

        // Handle Responsive Resize
        function onWindowResize() {
            const container = document.getElementById('canvasContainer');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Event Listeners for UI
        function setupEventListeners() {
            const userReqInput = document.getElementById('userRequestInput');
            userReqInput.addEventListener('input', updatePrompt);

            // Canvas Click Inspection
            const container = document.getElementById('canvasContainer');
            container.addEventListener('click', onCanvasClick);
        }

        // Keep prompt strictly synchronized with user input placed at the VERY END
        function updatePrompt() {
            const userReq = document.getElementById('userRequestInput').value.trim();
            const finalPrompt = BASE_SYSTEM_PROMPT + "\n" + (userReq ? userReq : "[Describe your 3D model here]");
            document.getElementById('generatedPromptText').value = finalPrompt;
        }

        // Copy Engineered Prompt to Clipboard
        function copyMasterPrompt() {
            const copyArea = document.getElementById('generatedPromptText');
            
            // Select and execute copy command for sandboxed iframe compatibility
            copyArea.focus();
            copyArea.select();
            
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Copy failed', err);
            }

            const copyBtn = document.getElementById('copyBtn');
            if (success) {
                copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Copied!</span>`;
                copyBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                showToast("System prompt copied to clipboard! Paste into your LLM.", "fa-copy");
            } else {
                showToast("Failed to copy automatically. Text is selected, press Ctrl+C / Cmd+C.", "fa-triangle-exclamation", "bg-amber-600");
            }

            setTimeout(() => {
                copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> <span>Copy Prompt</span>`;
                copyBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
            }, 2500);
        }

        // Command Processing Logic
        function parseAndExecute() {
            const jsonInput = document.getElementById('aiJsonInput').value.trim();
            if (!jsonInput) {
                showToast("Please paste AI JSON commands first!", "fa-triangle-exclamation", "bg-amber-600");
                return;
            }

            try {
                // Extract JSON array even if AI surrounds it with Markdown code blocks
                const jsonMatch = jsonInput.match(/\[\s*\{[\s\S]*\}\s*\]/);
                const rawJson = jsonMatch ? jsonMatch[0] : jsonInput;
                const commands = JSON.parse(rawJson);

                if (!Array.isArray(commands)) {
                    throw new Error("Command input must be a JSON array of objects.");
                }

                let executedCount = 0;
                commands.forEach(cmd => {
                    if (processCommand(cmd)) executedCount++;
                });

                updateStats();
                showToast(`Successfully executed ${executedCount} 3D commands!`, "fa-circle-check");
            } catch (err) {
                console.error(err);
                showToast("JSON Syntax Error: " + err.message, "fa-circle-xmark", "bg-red-600");
            }
        }

        // Process Individual Object Command
        function processCommand(cmd) {
            const op = (cmd.op || 'add').toLowerCase();
            const id = cmd.id || 'obj_' + Math.random().toString(36).substr(2, 9);

            if (op === 'clear') {
                clearScene();
                return true;
            }

            if (op === 'delete') {
                if (objectsMap.has(id)) {
                    scene.remove(objectsMap.get(id));
                    objectsMap.delete(id);
                    return true;
                }
                return false;
            }

            if (op === 'add' || op === 'update' || !cmd.op) {
                if (objectsMap.has(id)) {
                    scene.remove(objectsMap.get(id));
                }

                const mesh = createMeshFromCommand(cmd);
                mesh.name = id;
                mesh.userData = cmd;

                scene.add(mesh);
                objectsMap.set(id, mesh);
                return true;
            }

            return false;
        }

        // Create Mesh & Material from Ultra-Flexible Properties
        function createMeshFromCommand(cmd) {
            const type = (cmd.type || 'box').toLowerCase();
            let geometry;

            // Flexible shorthand resolution
            const pos = cmd.p || cmd.pos || [0, 0, 0];
            const rot = cmd.r || cmd.rot || [0, 0, 0];
            const scale = cmd.s || cmd.scale || [1, 1, 1];

            // Build Geometry
            switch (type) {
                case 'box':
                case 'cube':
                    const size = cmd.size || [1, 1, 1];
                    geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
                    break;
                case 'sphere':
                    const rad = cmd.rad || cmd.radius || 0.5;
                    geometry = new THREE.SphereGeometry(rad, 32, 32);
                    break;
                case 'cylinder':
                    const radTop = cmd.radTop !== undefined ? cmd.radTop : (cmd.rad || 0.5);
                    const radBot = cmd.radBot !== undefined ? cmd.radBot : (cmd.rad || 0.5);
                    const height = cmd.h || cmd.height || 1;
                    const segments = cmd.seg || 32;
                    geometry = new THREE.CylinderGeometry(radTop, radBot, height, segments);
                    break;
                case 'cone':
                    const coneRad = cmd.rad || 0.5;
                    const coneH = cmd.h || 1;
                    const coneSeg = cmd.seg || 32;
                    geometry = new THREE.ConeGeometry(coneRad, coneH, coneSeg);
                    break;
                case 'torus':
                    const tRad = cmd.rad || 0.5;
                    const tube = cmd.tube || 0.15;
                    geometry = new THREE.TorusGeometry(tRad, tube, 16, 100);
                    break;
                case 'torusknot':
                case 'torus_knot':
                    const tkRad = cmd.rad || 0.5;
                    const tkTube = cmd.tube || 0.15;
                    geometry = new THREE.TorusKnotGeometry(tkRad, tkTube, 128, 32);
                    break;
                case 'dodecahedron':
                    geometry = new THREE.DodecahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'icosahedron':
                    geometry = new THREE.IcosahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'octahedron':
                    geometry = new THREE.OctahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'tetrahedron':
                    geometry = new THREE.TetrahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'ring':
                    geometry = new THREE.RingGeometry(cmd.radInner || 0.2, cmd.radOuter || 0.5, 32);
                    break;
                case 'plane':
                    const planeSize = cmd.size || [1, 1];
                    geometry = new THREE.PlaneGeometry(planeSize[0], planeSize[1]);
                    break;
                case 'capsule':
                    geometry = new THREE.CapsuleGeometry(cmd.rad || 0.25, cmd.h || 0.5, 8, 16);
                    break;
                default:
                    geometry = new THREE.BoxGeometry(1, 1, 1);
            }

            // PBR Material Settings
            const color = cmd.c || cmd.col || cmd.color || '#818cf8';
            const roughness = cmd.rough !== undefined ? cmd.rough : 0.3;
            const metalness = cmd.metal !== undefined ? cmd.metal : 0.2;
            const transmission = cmd.trans !== undefined ? cmd.trans : 0.0;
            const opacity = cmd.opac !== undefined ? cmd.opac : (cmd.opacity !== undefined ? cmd.opacity : 1.0);

            const material = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(color),
                roughness: roughness,
                metalness: metalness,
                transmission: transmission,
                transparent: transmission > 0 || opacity < 1,
                opacity: opacity,
                wireframe: cmd.wire || isWireframe,
                side: THREE.DoubleSide
            });

            // Emissive Glow
            if (cmd.emiss || cmd.emissive) {
                material.emissive = new THREE.Color(cmd.emiss || cmd.emissive);
                material.emissiveIntensity = cmd.emissInt !== undefined ? cmd.emissInt : 1.0;
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(pos[0], pos[1], pos[2]);
            mesh.rotation.set(rot[0], rot[1], rot[2]);
            mesh.scale.set(scale[0], scale[1], scale[2]);

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            return mesh;
        }

        // Raycasting Object Selection / Inspection
        function onCanvasClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(objectsMap.values()));

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const data = hit.userData;
                const displayCol = data.c || data.col || '#818cf8';
                
                document.getElementById('inspectName').innerText = `${data.type || 'Object'} (${hit.name})`;
                document.getElementById('inspectDetails').innerText = `Pos: [${hit.position.x.toFixed(2)}, ${hit.position.y.toFixed(2)}, ${hit.position.z.toFixed(2)}] | Col: ${displayCol}`;
                document.getElementById('inspectColorBadge').style.backgroundColor = displayCol;
                
                document.getElementById('inspectorBanner').classList.remove('hidden');
            }
        }

        function hideInspector() {
            document.getElementById('inspectorBanner').classList.add('hidden');
        }

        // Utility: Clear Canvas Scene
        function clearScene() {
            objectsMap.forEach((mesh) => {
                scene.remove(mesh);
                if (mesh.geometry) mesh.geometry.dispose();
                if (mesh.material) mesh.material.dispose();
            });
            objectsMap.clear();
            hideInspector();
            updateStats();
            showToast("Canvas cleared!", "fa-trash-can");
        }

        // Update Polygon and Object Count Counters
        function updateStats() {
            let totalPolys = 0;
            objectsMap.forEach(mesh => {
                if (mesh.geometry && mesh.geometry.index) {
                    totalPolys += mesh.geometry.index.count / 3;
                } else if (mesh.geometry && mesh.geometry.attributes.position) {
                    totalPolys += mesh.geometry.attributes.position.count / 3;
                }
            });

            document.getElementById('objCount').innerText = objectsMap.size;
            document.getElementById('polyCount').innerText = Math.round(totalPolys);
        }

        // Controls Helpers
        function resetCamera() {
            camera.position.set(8, 6, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
        }

        function toggleWireframe() {
            isWireframe = !isWireframe;
            objectsMap.forEach(mesh => {
                if (mesh.material) mesh.material.wireframe = isWireframe;
            });
        }

        // Export FBX with Side-by-Side Packed PNG Textures in Zip
        function exportFbxWithTextures() {
            if (objectsMap.size === 0) {
                showToast("Canvas is empty! Add models before exporting.", "fa-triangle-exclamation", "bg-amber-600");
                return;
            }

            showToast("Packaging FBX model and textures...", "fa-spinner", "bg-indigo-600");

            // Group user models into a export scene container
            const exportGroup = new THREE.Group();
            objectsMap.forEach(mesh => {
                exportGroup.add(mesh.clone());
            });

            // Initialize FBXExporter
            const exporter = new THREE.FBXExporter();
            const result = exporter.parse(exportGroup);

            // Create ZIP package
            const zip = new JSZip();
            const textureFolder = zip.folder("textures");

            // Save FBX file into ZIP root
            zip.file("model.fbx", result);

            // Generate procedural PNG texture maps for each object side-by-side
            let texIndex = 1;
            objectsMap.forEach((mesh, id) => {
                const mat = mesh.material;
                if (!mat) return;

                // 1. Generate Diffuse Color Texture Map
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#' + mat.color.getHexString();
                ctx.fillRect(0, 0, 512, 512);

                // Convert canvas to Data URL base64
                const diffDataUrl = canvas.toDataURL('image/png').split(',')[1];
                const diffFileName = `texture_${texIndex}_diffuse.png`;
                zip.file(diffFileName, diffDataUrl, { base64: true });
                textureFolder.file(diffFileName, diffDataUrl, { base64: true });

                // 2. Generate Emissive Texture Map if glowing
                if (mat.emissive && mat.emissive.getHex() > 0) {
                    const eCanvas = document.createElement('canvas');
                    eCanvas.width = 512;
                    eCanvas.height = 512;
                    const eCtx = eCanvas.getContext('2d');

                    eCtx.fillStyle = '#' + mat.emissive.getHexString();
                    eCtx.fillRect(0, 0, 512, 512);

                    const emissDataUrl = eCanvas.toDataURL('image/png').split(',')[1];
                    const emissFileName = `texture_${texIndex}_emissive.png`;
                    zip.file(emissFileName, emissDataUrl, { base64: true });
                    textureFolder.file(emissFileName, emissDataUrl, { base64: true });
                }

                texIndex++;
            });

            // Download ZIP archive with side-by-side FBX and textures
            zip.generateAsync({ type: "blob" }).then(function (content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "3d_model_package.zip";
                link.click();
                URL.revokeObjectURL(link.href);

                showToast("FBX model & side-by-side textures exported!", "fa-circle-check", "bg-emerald-600");
            });
        }

        // Toast Notification System
        function showToast(message, icon = "fa-circle-info", bgClass = "bg-indigo-600") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            toastIcon.className = `fa-solid ${icon}`;
            toast.className = `absolute top-4 left-4 ${bgClass} text-white text-xs px-3.5 py-2 rounded-lg backdrop-blur shadow-xl transition-all duration-300 opacity-100 transform translate-y-0 z-20 flex items-center space-x-2`;

            setTimeout(() => {
                toast.className = toast.className.replace('opacity-100 translate-y-0', 'opacity-0 -translate-y-2 pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
