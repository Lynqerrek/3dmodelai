<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Native 3D Modelling Studio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js r128 and matching OrbitControls build. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- ZIP packaging. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!--
      Three.js does not ship an FBX exporter in this build. This ESM package
      exports the Three.js scene and supports external texture file references.
    -->
    <script type="module">
        try {
            const module = await import(
                "https://cdn.jsdelivr.net/npm/three-js-fbx-exporter@0.1.3/src/index.js"
            );
            window.exportFbxScene = module.exportFbx;
            window.dispatchEvent(new Event("fbx-exporter-ready"));
        } catch (error) {
            console.error("Could not load the FBX exporter:", error);
            window.fbxExporterLoadError = error;
            window.dispatchEvent(new Event("fbx-exporter-error"));
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        canvas { outline: none; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none bg-slate-950 font-sans text-slate-200">

    <!-- Top Header -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-cube text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-slate-100 leading-tight">AI 3D Architect Engine</h1>
                <p class="text-xs text-slate-400">Ultra-Simple Commands &bull; PBR Output</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-4">
            <div class="text-xs text-slate-400 hidden sm:flex items-center space-x-3 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                <span>Objects: <strong id="objCount" class="text-indigo-400 font-mono">0</strong></span>
                <span class="text-slate-700">|</span>
                <span>Polys: <strong id="polyCount" class="text-indigo-400 font-mono">0</strong></span>
            </div>

            <button onclick="exportFbxWithTextures()" class="px-3 py-1.5 text-xs bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg transition-colors flex items-center space-x-1.5">
                <i class="fa-solid fa-file-export"></i>
                <span>Export FBX + Texture (.zip)</span>
            </button>

            <button onclick="clearScene()" class="px-3 py-1.5 text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg transition-colors flex items-center space-x-1.5">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden sm:inline">Clear Canvas</span>
            </button>
        </div>
    </header>

    <!-- Main App Workspace -->
    <main class="flex-1 flex overflow-hidden relative">
        <!-- Left Column -->
        <aside class="w-full md:w-96 border-r border-slate-800 bg-slate-900 flex flex-col z-10 shrink-0">
            <div class="p-4 border-b border-slate-800 bg-slate-900/50">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>1. Describe What You Want</span>
                    <span class="text-[10px] text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">Prompt Input</span>
                </label>
                <textarea id="userRequestInput" rows="3"
                    placeholder="e.g. Mechanical dragon with metallic scales, glowing blue core, and large detailed wings..."
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition-all"></textarea>
            </div>

            <div class="flex-1 p-4 flex flex-col overflow-hidden bg-slate-900">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                        <span>2. Copy Prompt for AI</span>
                    </label>
                    <button onclick="copyMasterPrompt()" id="copyBtn" class="px-2.5 py-1 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium transition-all shadow-md shadow-indigo-600/20 flex items-center space-x-1">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copy Prompt</span>
                    </button>
                </div>
                <div class="flex-1 relative rounded-lg border border-slate-800 bg-slate-950 overflow-hidden">
                    <textarea id="generatedPromptText" readonly class="w-full h-full bg-transparent p-3 text-[11px] font-mono text-slate-400 leading-relaxed resize-none focus:outline-none select-all"></textarea>
                </div>
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-950/80">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>3. Paste AI Commands JSON</span>
                    <span class="text-[10px] text-slate-500">Auto-Parses</span>
                </label>
                <textarea id="aiJsonInput" rows="4"
                    placeholder='Paste a JSON array, e.g. [{ "type": "torusKnot", "p": [0,1,0], "c": "#00ffff" }]'
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 placeholder-slate-600 font-mono focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition-all"></textarea>

                <button onclick="parseAndExecute()" class="w-full mt-3 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-xs rounded-lg shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Execute Commands on Canvas</span>
                </button>
            </div>
        </aside>

        <!-- Right Column: 3D Viewport -->
        <section class="flex-1 relative bg-slate-950 flex flex-col min-w-0">
            <div id="canvasContainer" class="w-full h-full relative cursor-grab active:cursor-grabbing"></div>

            <div class="absolute top-4 right-4 flex flex-col space-y-2 z-10">
                <button onclick="resetCamera()" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 hover:text-white backdrop-blur transition-all shadow-lg" title="Reset Camera">
                    <i class="fa-solid fa-arrows-to-eye"></i>
                </button>
                <button onclick="toggleGrid()" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 hover:text-white backdrop-blur transition-all shadow-lg" title="Toggle Grid Floor">
                    <i class="fa-solid fa-border-all"></i>
                </button>
                <button onclick="toggleWireframe()" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 hover:text-white backdrop-blur transition-all shadow-lg" title="Toggle Wireframe Mode">
                    <i class="fa-solid fa-vector-square"></i>
                </button>
            </div>

            <div id="inspectorBanner" class="absolute bottom-4 left-4 right-4 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-lg p-3 text-xs text-slate-300 flex items-center justify-between shadow-xl hidden z-10">
                <div class="flex items-center space-x-3">
                    <span id="inspectColorBadge" class="w-4 h-4 rounded-full border border-white/20 inline-block"></span>
                    <div>
                        <span class="font-bold text-slate-100" id="inspectName">Object</span>
                        <span class="text-slate-400 text-[11px] ml-2 font-mono" id="inspectDetails">Pos: [0, 0, 0]</span>
                    </div>
                </div>
                <button onclick="hideInspector()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="toast" class="absolute top-4 left-4 bg-indigo-600/90 text-white text-xs px-3.5 py-2 rounded-lg backdrop-blur shadow-xl transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2 z-20 flex items-center space-x-2">
                <i class="fa-solid fa-circle-check" id="toastIcon"></i>
                <span id="toastMsg">Ready</span>
            </div>
        </section>
    </main>

    <script>
        // ------------------------------------------------------------
        // Three.js scene state
        // ------------------------------------------------------------
        let scene, camera, renderer, controls;
        const objectsMap = new Map();
        let gridHelper;
        let isWireframe = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ------------------------------------------------------------
        // Prompt template
        // ------------------------------------------------------------
        const BASE_SYSTEM_PROMPT = `You are an elite 3D Master Architect and Senior Technical Artist. Output ONLY a valid JSON array of 3D primitive objects to build the user's request with expressive geometry, rich structural depth, and strong spatial composition. Do not include explanations or Markdown fences. please dont make the models primitive and make sure that you dont make errors use your full potential and research 3d models and make your own and take your time and make it look good, and analyse the model fully after you make it and fix everything wrong and make it better

PRIMITIVES & GEOMETRY TYPES:
- "type": "box" | "sphere" | "cylinder" | "cone" | "torus" | "torusKnot" | "capsule" | "dodecahedron" | "icosahedron" | "octahedron" | "tetrahedron" | "ring" | "plane"

EASY SHORTHAND & EXPRESSIVE PROPERTIES:
- "p" or "pos": [x, y, z] (position; place the model on or above the ground where possible)
- "r" or "rot": [rx, ry, rz] (rotation angles in radians)
- "s" or "scale": [sx, sy, sz] (scale multiplier)
- "id": optional unique object name

FLEXIBLE SIZING:
- "box": "size": [width, height, depth]
- "sphere" / "dodecahedron" / "icosahedron" / "octahedron" / "tetrahedron": "rad": radius
- "cylinder" / "cone": "radTop": top radius, "radBot": bottom radius, "h": height, "seg": radial segments
- "torus" / "torusKnot": "rad": radius, "tube": tube radius
- "capsule": "rad": radius, "h": cylindrical body height
- "ring": "radInner": inner radius, "radOuter": outer radius
- "plane": "size": [width, height]

PBR MATERIAL ATTRIBUTES:
- "c" or "col": color hex code, e.g. "#1e293b", "#3b82f6", "#f59e0b"
- "rough": roughness from 0.0 to 1.0
- "metal": metalness from 0.0 to 1.0
- "trans": transmission from 0.0 to 1.0
- "opac": opacity from 0.0 to 1.0
- "emiss": emissive hex color
- "emissInt": emissive intensity
- "wire": true / false

DESIGN RULES:
1. Deconstruct the concept into primary forms, secondary structures, small details, and accents.
2. Use material contrast: combine metallic structures, matte parts, and accent colors.
3. Keep proportions balanced and avoid placing the whole model below Y = 0.
4. Return ONLY a valid JSON array of objects.

USER REQUEST:`;

        // ------------------------------------------------------------
        // Initialize Three.js engine
        // ------------------------------------------------------------
        window.addEventListener('load', () => {
            initEngine();
            setupEventListeners();
            updatePrompt();
            showToast('Engine initialized. Canvas ready!', 'fa-circle-check');
        });

        function initEngine() {
            const container = document.getElementById('canvasContainer');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            scene.fog = new THREE.FogExp2(0x090d16, 0.025);

            camera = new THREE.PerspectiveCamera(
                45,
                Math.max(container.clientWidth, 1) / Math.max(container.clientHeight, 1),
                0.1,
                1000
            );
            camera.position.set(8, 6, 10);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.5);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            const rimLight = new THREE.PointLight(0xc084fc, 0.8, 20);
            rimLight.position.set(0, 5, -8);
            scene.add(rimLight);

            gridHelper = new THREE.GridHelper(30, 30, 0x475569, 0x1e293b);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            const container = document.getElementById('canvasContainer');
            if (!container || !camera || !renderer) return;

            camera.aspect = Math.max(container.clientWidth, 1) / Math.max(container.clientHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function setupEventListeners() {
            document.getElementById('userRequestInput').addEventListener('input', updatePrompt);
            document.getElementById('canvasContainer').addEventListener('click', onCanvasClick);
        }

        function updatePrompt() {
            const userReq = document.getElementById('userRequestInput').value.trim();
            const finalPrompt = BASE_SYSTEM_PROMPT + '\n' + (userReq || '[Describe your 3D model here]');
            document.getElementById('generatedPromptText').value = finalPrompt;
        }

        async function copyMasterPrompt() {
            const copyArea = document.getElementById('generatedPromptText');
            const copyBtn = document.getElementById('copyBtn');
            const text = copyArea.value;
            let success = false;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    success = true;
                } else {
                    copyArea.focus();
                    copyArea.select();
                    success = document.execCommand('copy');
                }
            } catch (error) {
                console.warn('Clipboard copy failed:', error);
            }

            if (success) {
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Copied!</span>';
                showToast('System prompt copied to clipboard!', 'fa-copy', 'bg-emerald-600');
            } else {
                copyArea.focus();
                copyArea.select();
                showToast('Text selected. Press Ctrl+C / Cmd+C to copy.', 'fa-triangle-exclamation', 'bg-amber-600');
            }

            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> <span>Copy Prompt</span>';
            }, 2200);
        }

        // ------------------------------------------------------------
        // JSON command parsing and object creation
        // ------------------------------------------------------------
        function parseAndExecute() {
            const jsonInput = document.getElementById('aiJsonInput').value.trim();
            if (!jsonInput) {
                showToast('Please paste AI JSON commands first!', 'fa-triangle-exclamation', 'bg-amber-600');
                return;
            }

            try {
                let rawJson = jsonInput.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
                const firstArray = rawJson.indexOf('[');
                const lastArray = rawJson.lastIndexOf(']');
                if (firstArray !== -1 && lastArray > firstArray) {
                    rawJson = rawJson.slice(firstArray, lastArray + 1);
                }

                const commands = JSON.parse(rawJson);
                if (!Array.isArray(commands)) {
                    throw new Error('Command input must be a JSON array of objects.');
                }

                let executedCount = 0;
                commands.forEach(command => {
                    if (command && typeof command === 'object' && processCommand(command)) {
                        executedCount++;
                    }
                });

                updateStats();
                showToast(`Successfully executed ${executedCount} 3D commands!`, 'fa-circle-check');
            } catch (error) {
                console.error(error);
                showToast('JSON Syntax Error: ' + error.message, 'fa-circle-xmark', 'bg-red-600');
            }
        }

        function disposeObjectResources(object) {
            if (!object) return;
            if (object.geometry) object.geometry.dispose();
            if (Array.isArray(object.material)) {
                object.material.forEach(material => material && material.dispose());
            } else if (object.material) {
                object.material.dispose();
            }
        }

        function processCommand(cmd) {
            const op = String(cmd.op || 'add').toLowerCase();
            const id = cmd.id || ('obj_' + Math.random().toString(36).slice(2, 11));

            if (op === 'clear') {
                clearScene();
                return true;
            }

            if (op === 'delete') {
                if (!objectsMap.has(id)) return false;
                const oldObject = objectsMap.get(id);
                scene.remove(oldObject);
                disposeObjectResources(oldObject);
                objectsMap.delete(id);
                return true;
            }

            if (op === 'add' || op === 'update' || !cmd.op) {
                if (objectsMap.has(id)) {
                    const oldObject = objectsMap.get(id);
                    scene.remove(oldObject);
                    disposeObjectResources(oldObject);
                }

                const mesh = createMeshFromCommand(cmd);
                mesh.name = id;
                mesh.userData = { ...cmd };
                scene.add(mesh);
                objectsMap.set(id, mesh);
                return true;
            }

            return false;
        }

        function createCapsuleGeometry(radius, bodyHeight, radialSegments = 24) {
            // A LatheGeometry capsule fallback works with Three.js r128.
            const points = [];
            const halfBody = Math.max(0, bodyHeight) / 2;
            const steps = 8;

            for (let i = 0; i <= steps; i++) {
                const angle = -Math.PI / 2 + (Math.PI / 2) * (i / steps);
                points.push(new THREE.Vector2(
                    radius * Math.cos(angle),
                    -halfBody + radius * Math.sin(angle)
                ));
            }
            for (let i = 0; i <= steps; i++) {
                const angle = (Math.PI / 2) * (i / steps);
                points.push(new THREE.Vector2(
                    radius * Math.cos(angle),
                    halfBody + radius * Math.sin(angle)
                ));
            }

            return new THREE.LatheGeometry(points, radialSegments);
        }

        function createMeshFromCommand(cmd) {
            const type = String(cmd.type || 'box').toLowerCase();
            let geometry;

            const pos = cmd.p || cmd.pos || [0, 0, 0];
            const rot = cmd.r || cmd.rot || [0, 0, 0];
            const scale = cmd.s || cmd.scale || [1, 1, 1];

            switch (type) {
                case 'box':
                case 'cube': {
                    const size = cmd.size || [1, 1, 1];
                    geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
                    break;
                }
                case 'sphere': {
                    const radius = cmd.rad || cmd.radius || 0.5;
                    geometry = new THREE.SphereGeometry(radius, 32, 32);
                    break;
                }
                case 'cylinder': {
                    const radiusTop = cmd.radTop !== undefined ? cmd.radTop : (cmd.rad || 0.5);
                    const radiusBottom = cmd.radBot !== undefined ? cmd.radBot : (cmd.rad || 0.5);
                    const height = cmd.h || cmd.height || 1;
                    geometry = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, cmd.seg || 32);
                    break;
                }
                case 'cone': {
                    geometry = new THREE.ConeGeometry(cmd.rad || 0.5, cmd.h || 1, cmd.seg || 32);
                    break;
                }
                case 'torus': {
                    geometry = new THREE.TorusGeometry(cmd.rad || 0.5, cmd.tube || 0.15, 16, 100);
                    break;
                }
                case 'torusknot':
                case 'torus_knot': {
                    geometry = new THREE.TorusKnotGeometry(cmd.rad || 0.5, cmd.tube || 0.15, 128, 32);
                    break;
                }
                case 'dodecahedron':
                    geometry = new THREE.DodecahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'icosahedron':
                    geometry = new THREE.IcosahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'octahedron':
                    geometry = new THREE.OctahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'tetrahedron':
                    geometry = new THREE.TetrahedronGeometry(cmd.rad || 0.5);
                    break;
                case 'ring':
                    geometry = new THREE.RingGeometry(cmd.radInner || 0.2, cmd.radOuter || 0.5, 32);
                    break;
                case 'plane': {
                    const planeSize = cmd.size || [1, 1];
                    geometry = new THREE.PlaneGeometry(planeSize[0], planeSize[1]);
                    break;
                }
                case 'capsule':
                    geometry = createCapsuleGeometry(cmd.rad || 0.25, cmd.h || 0.5, cmd.seg || 24);
                    break;
                default:
                    geometry = new THREE.BoxGeometry(1, 1, 1);
            }

            const color = cmd.c || cmd.col || cmd.color || '#818cf8';
            const roughness = cmd.rough !== undefined ? cmd.rough : 0.3;
            const metalness = cmd.metal !== undefined ? cmd.metal : 0.2;
            const transmission = cmd.trans !== undefined ? cmd.trans : 0.0;
            const opacity = cmd.opac !== undefined ? cmd.opac : (cmd.opacity !== undefined ? cmd.opacity : 1.0);

            const material = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(color),
                roughness,
                metalness,
                transmission,
                transparent: transmission > 0 || opacity < 1,
                opacity,
                wireframe: Boolean(cmd.wire) || isWireframe,
                side: THREE.DoubleSide
            });

            if (cmd.emiss || cmd.emissive) {
                material.emissive = new THREE.Color(cmd.emiss || cmd.emissive);
                material.emissiveIntensity = cmd.emissInt !== undefined ? cmd.emissInt : 1.0;
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(pos[0] || 0, pos[1] || 0, pos[2] || 0);
            mesh.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
            mesh.scale.set(
                scale[0] !== undefined ? scale[0] : 1,
                scale[1] !== undefined ? scale[1] : 1,
                scale[2] !== undefined ? scale[2] : 1
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // ------------------------------------------------------------
        // Selection / inspection
        // ------------------------------------------------------------
        function onCanvasClick(event) {
            if (!renderer || !camera) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersections = raycaster.intersectObjects(Array.from(objectsMap.values()), false);

            if (intersections.length > 0) {
                const hit = intersections[0].object;
                const data = hit.userData || {};
                const displayColor = data.c || data.col || data.color || '#818cf8';
                document.getElementById('inspectName').innerText = `${data.type || 'Object'} (${hit.name})`;
                document.getElementById('inspectDetails').innerText =
                    `Pos: [${hit.position.x.toFixed(2)}, ${hit.position.y.toFixed(2)}, ${hit.position.z.toFixed(2)}] | Col: ${displayColor}`;
                document.getElementById('inspectColorBadge').style.backgroundColor = displayColor;
                document.getElementById('inspectorBanner').classList.remove('hidden');
            }
        }

        function hideInspector() {
            document.getElementById('inspectorBanner').classList.add('hidden');
        }

        // ------------------------------------------------------------
        // Scene management / statistics / viewport controls
        // ------------------------------------------------------------
        function clearScene() {
            objectsMap.forEach(mesh => {
                scene.remove(mesh);
                disposeObjectResources(mesh);
            });
            objectsMap.clear();
            hideInspector();
            updateStats();
            showToast('Canvas cleared!', 'fa-trash-can');
        }

        function updateStats() {
            let totalPolys = 0;
            objectsMap.forEach(mesh => {
                const geometry = mesh.geometry;
                if (!geometry || !geometry.attributes.position) return;
                totalPolys += geometry.index
                    ? geometry.index.count / 3
                    : geometry.attributes.position.count / 3;
            });
            document.getElementById('objCount').innerText = objectsMap.size;
            document.getElementById('polyCount').innerText = Math.round(totalPolys);
        }

        function resetCamera() {
            camera.position.set(8, 6, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
        }

        function toggleWireframe() {
            isWireframe = !isWireframe;
            objectsMap.forEach(mesh => {
                const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                materials.forEach(material => {
                    if (material) material.wireframe = isWireframe;
                });
            });
        }

        // ------------------------------------------------------------
        // Shared diffuse texture atlas for the complete model
        // ------------------------------------------------------------
        function createSharedColorAtlas(meshes) {
            const tileSize = 256;
            const columns = Math.ceil(Math.sqrt(meshes.length));
            const rows = Math.ceil(meshes.length / columns);
            const canvas = document.createElement('canvas');
            canvas.width = columns * tileSize;
            canvas.height = rows * tileSize;

            const context = canvas.getContext('2d');
            if (!context) throw new Error('Could not create the texture atlas canvas.');

            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, canvas.width, canvas.height);

            const cells = [];
            meshes.forEach((mesh, index) => {
                const sourceMaterial = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
                const color = sourceMaterial && sourceMaterial.color
                    ? '#' + sourceMaterial.color.getHexString()
                    : '#ffffff';

                const column = index % columns;
                const row = Math.floor(index / columns);
                const x = column * tileSize;
                const y = row * tileSize;

                // Each tile stores one object's diffuse/base color.
                context.fillStyle = color;
                context.fillRect(x, y, tileSize, tileSize);
                cells.push({ column, row });
            });

            return { canvas, columns, rows, tileSize, cells };
        }

        function remapGeometryUvsToAtlas(geometry, cell, atlas, objectName) {
            const uv = geometry.getAttribute('uv');
            if (!uv) {
                throw new Error(`Object "${objectName}" has no UV coordinates, so it cannot use the shared atlas.`);
            }

            const uMin = cell.column / atlas.columns;
            const uMax = (cell.column + 1) / atlas.columns;
            // Canvas rows start at the top; FBX UV V coordinates start at the bottom.
            const rowFromBottom = atlas.rows - 1 - cell.row;
            const vMin = rowFromBottom / atlas.rows;
            const vMax = (rowFromBottom + 1) / atlas.rows;

            for (let i = 0; i < uv.count; i++) {
                const u = Math.max(0, Math.min(1, uv.getX(i)));
                const v = Math.max(0, Math.min(1, uv.getY(i)));
                uv.setXY(
                    i,
                    uMin + u * (uMax - uMin),
                    vMin + v * (vMax - vMin)
                );
            }
            uv.needsUpdate = true;
        }

        function createExternalAtlasTexture(atlas) {
            // Intentionally use an image placeholder containing dimensions only.
            // It prevents the FBX exporter from adding PNG bytes to the FBX.
            // The real PNG is written separately as model_texture.png.
            const texture = new THREE.Texture({
                width: atlas.canvas.width,
                height: atlas.canvas.height
            });
            texture.name = 'model_texture';
            texture.fileName = 'model_texture.png';
            texture.relativeFileName = 'model_texture.png';
            texture.width = atlas.canvas.width;
            texture.height = atlas.canvas.height;
            texture.flipY = false;
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.userData = {
                fileName: 'model_texture.png',
                relativeFileName: 'model_texture.png',
                width: atlas.canvas.width,
                height: atlas.canvas.height
            };
            return texture;
        }

        function cloneMaterialForAtlas(sourceMaterial, atlasTexture) {
            const material = sourceMaterial
                ? sourceMaterial.clone()
                : new THREE.MeshStandardMaterial();

            // The source color has been baked into the PNG atlas.
            if (material.color) material.color.set(0xffffff);
            material.map = atlasTexture;
            material.wireframe = false;
            material.needsUpdate = true;
            return material;
        }

        function buildFbxExportGroup(meshes, atlas, atlasTexture) {
            const exportGroup = new THREE.Group();
            exportGroup.name = 'ExportedModel';

            meshes.forEach((sourceMesh, index) => {
                const clone = sourceMesh.clone(false);
                clone.name = sourceMesh.name || `Object_${index + 1}`;
                clone.geometry = sourceMesh.geometry.clone();
                remapGeometryUvsToAtlas(
                    clone.geometry,
                    atlas.cells[index],
                    atlas,
                    clone.name
                );

                if (Array.isArray(sourceMesh.material)) {
                    clone.material = sourceMesh.material.map(material =>
                        cloneMaterialForAtlas(material, atlasTexture)
                    );
                } else {
                    clone.material = cloneMaterialForAtlas(sourceMesh.material, atlasTexture);
                }

                exportGroup.add(clone);
            });

            exportGroup.updateMatrixWorld(true);
            return exportGroup;
        }

        function disposeExportGroup(exportGroup, atlasTexture) {
            exportGroup.traverse(object => {
                if (object.geometry) object.geometry.dispose();
                if (Array.isArray(object.material)) {
                    object.material.forEach(material => material && material.dispose());
                } else if (object.material) {
                    object.material.dispose();
                }
            });
            atlasTexture.dispose();
        }

        function canvasToPngBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error('The browser could not create the PNG texture.'));
                }, 'image/png');
            });
        }

        // ------------------------------------------------------------
        // Export FBX + one external PNG texture in the same ZIP folder
        // ------------------------------------------------------------
        async function exportFbxWithTextures() {
            if (objectsMap.size === 0) {
                showToast('Canvas is empty! Add models before exporting.', 'fa-triangle-exclamation', 'bg-amber-600');
                return;
            }

            if (typeof window.exportFbxScene !== 'function') {
                const message = window.fbxExporterLoadError
                    ? 'FBX exporter failed to load. Check your internet connection.'
                    : 'FBX exporter is still loading. Try again in a moment.';
                showToast(message, 'fa-triangle-exclamation', 'bg-amber-600');
                return;
            }

            if (typeof JSZip === 'undefined') {
                showToast('ZIP library has not loaded.', 'fa-triangle-exclamation', 'bg-amber-600');
                return;
            }

            let exportGroup = null;
            let atlasTexture = null;

            try {
                showToast('Building one shared texture atlas and FBX...', 'fa-spinner', 'bg-indigo-600');

                const meshes = Array.from(objectsMap.values());
                const atlas = createSharedColorAtlas(meshes);
                atlasTexture = createExternalAtlasTexture(atlas);
                exportGroup = buildFbxExportGroup(meshes, atlas, atlasTexture);

                const warnings = [];
                const fbxBytes = window.exportFbxScene(exportGroup, {
                    format: 'binary',
                    target: 'threejs',
                    embedTextures: false,
                    warnings,
                    onWarning: warning => console.warn('FBX export warning:', warning)
                });

                if (!(fbxBytes instanceof Uint8Array) && !(fbxBytes instanceof ArrayBuffer)) {
                    throw new Error('The FBX exporter returned an unexpected result.');
                }

                const textureBlob = await canvasToPngBlob(atlas.canvas);
                const zip = new JSZip();

                // Both files are written at the ZIP root, beside one another.
                zip.file('model.fbx', fbxBytes);
                zip.file('model_texture.png', textureBlob);

                const zipBlob = await zip.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });

                const downloadUrl = URL.createObjectURL(zipBlob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = '3d_model_package.zip';
                document.body.appendChild(link);
                link.click();
                link.remove();

                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1500);

                if (warnings.length) {
                    console.warn('FBX exporter warnings:', warnings);
                }

                showToast('FBX + one external texture exported!', 'fa-circle-check', 'bg-emerald-600');
            } catch (error) {
                console.error('FBX export failed:', error);
                showToast('FBX export failed: ' + error.message, 'fa-circle-xmark', 'bg-red-600');
            } finally {
                if (exportGroup && atlasTexture) {
                    disposeExportGroup(exportGroup, atlasTexture);
                } else if (atlasTexture) {
                    atlasTexture.dispose();
                }
            }
        }

        // ------------------------------------------------------------
        // Toast notification
        // ------------------------------------------------------------
        function showToast(message, icon = 'fa-circle-info', bgClass = 'bg-indigo-600') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            document.getElementById('toastIcon').className = `fa-solid ${icon}`;
            toast.className = `absolute top-4 left-4 ${bgClass} text-white text-xs px-3.5 py-2 rounded-lg backdrop-blur shadow-xl transition-all duration-300 opacity-100 transform translate-y-0 z-20 flex items-center space-x-2`;

            clearTimeout(showToast.hideTimer);
            showToast.hideTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
